[project]
name = "disputable"
version = "0.1.0"
description = "An agent that decides which chargebacks to fight, built on the Airwallex sandbox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
disputable = "disputable.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disputable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
